<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block titulo %}AquaAlerta{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f0f8fc;
            color: #173b52;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background-color: #087da4;
        }

        .navbar-brand {
            font-weight: bold;
            font-size: 24px;
        }

        .navbar .nav-link {
            color: white;
        }

        .navbar .nav-link:hover {
            color: #b8f1ff;
        }

        .contenido {
            flex: 1;
        }

        .btn-aqua {
            background-color: #087da4;
            color: white;
            border: none;
        }

        .btn-aqua:hover {
            background-color: #065e7c;
            color: white;
        }

        footer {
            background-color: #173b52;
            color: white;
            text-align: center;
            padding: 22px;
            margin-top: 50px;
        }
    </style>

    {% block estilos %}{% endblock %}
</head>

<body>

    <!-- Menú de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">

            <a class="navbar-brand" href="{% url 'inicio' %}">
                💧 AquaAlerta
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal" aria-expanded="false" aria-label="Mostrar menú">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'inicio' %}">
                            Inicio
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'lista_reportes' %}">
                            Reportes
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'admin:index' %}">
                            Administración
                        </a>
                    </li>

                </ul>

            </div>

        </div>
    </nav>

    <!-- Contenido de cada página -->
    <main class="contenido">
        {% block contenido %}
        {% endblock %}
    </main>

    <!-- Pie de página -->
    <footer>
        AquaAlerta © 2026 | Proyecto académico - Equipo 02
    </footer>

    <!-- JavaScript Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    {% block scripts %}{% endblock %}

</body>

</html>
